name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Verify SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "echo Connected && whoami && pwd"

      - name: Create Website Directory
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "mkdir -p \$HOME/websitenew"

      - name: Copy Files to EC2 using SCP
        run: |
          HOME_DIR=$(ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "echo \$HOME")

          echo "Remote home: $HOME_DIR"

          scp -i ~/.ssh/id_rsa -r ./* \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:$HOME_DIR/websitenew/

      - name: Deploy Website
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF
          sudo mkdir -p /var/www/html
          sudo rm -rf /var/www/html/*
          sudo cp -r \$HOME/websitenew/* /var/www/html/
          sudo chown -R www-data:www-data /var/www/html
          EOF

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "ls -la /var/www/html"

      - name: Success
        run: echo "Website deployed successfully!"
