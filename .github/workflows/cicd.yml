name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create Website Directory on EC2
        run: |
          ssh -i ~/.ssh/id_rsa \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "mkdir -p ~/website"

      - name: Copy Files to EC2 using SCP
        run: |
          scp -i ~/.ssh/id_rsa -r ./* \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/website/

      - name: Deploy Website to /var/www/html
        run: |
          ssh -i ~/.ssh/id_rsa \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo rm -rf /var/www/html/*
            sudo cp -r ~/website/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
          EOF

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/id_rsa \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "ls -la /var/www/html"

      - name: Print Success
        run: echo " Website deployed successfully!"
